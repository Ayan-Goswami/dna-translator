[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-translator"
version = "2.0.0"
description = "6-frame DNA translator, ORF finder, mutation impact simulator, and protein profiler."
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.84",
    "pandas>=2.2",
    "plotly>=5.24",
    "streamlit>=1.40",
    "typer>=0.12",
]

[project.scripts]
dna-translator = "dna_translator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]